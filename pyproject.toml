[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anomaly-aware-forecasting"
version = "0.1.0"
description = "Joint probabilistic time series forecasting and regime-switching anomaly detection research prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.4",
]

[project.scripts]
aaf-evaluate = "aaf.eval.cli:main"
aaf-mdn-synthetic = "aaf.pipelines.mdn_synthetic:main"
aaf-synthetic-baseline = "aaf.pipelines.synthetic_baseline:main"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "mypy>=1.8",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aaf"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["aaf"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch.*"]
ignore_missing_imports = true
